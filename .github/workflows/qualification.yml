name: Qualification status publisher

on:
  workflow_dispatch:
    inputs:
      pull_request:
        required: true
        type: number
      expected_head:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and authenticate the pull request input
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg head "$EXPECTED_HEAD" --arg repo "$GITHUB_REPOSITORY" \
            '.state == "open" and .base.ref == "main" and .head.sha == $head
            and .head.repo.full_name == $repo and .base.repo.full_name == $repo
            and (.merge_commit_sha | test("^[0-9a-f]{40}$"))' <<< "$pr"
          {
            printf 'merge=%s\n' "$(jq -r .merge_commit_sha <<< "$pr")"
            printf 'base=%s\n' "$(jq -r .base.sha <<< "$pr")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/pull/${{ inputs.pull_request }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Evaluate the exact combined tree and publish the aggregate
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_BASE: ${{ steps.resolve.outputs.base }}
          PROOF_HEAD: ${{ inputs.expected_head }}
          PROOF_MERGE: ${{ steps.resolve.outputs.merge }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$PROOF_MERGE" ]]
          [[ "$(git rev-parse HEAD^1)" == "$PROOF_BASE" ]]
          [[ "$(git rev-parse HEAD^2)" == "$PROOF_HEAD" ]]
          PROOF_TREE="$(git rev-parse 'HEAD^{tree}')"
          export PROOF_TREE
          python3 - <<'PY'
          import json, os, pathlib

          candidate = json.loads(pathlib.Path("qualification-input.json").read_text())
          selection, reason = candidate.get("selection"), candidate.get("emptyReason")
          passed = bool(
              selection == ["value-control"] and candidate.get("observed") == "healthy"
              or selection == [] and isinstance(reason, str) and reason.strip()
          )
          report = {
              "base": os.environ["PROOF_BASE"], "head": os.environ["PROOF_HEAD"],
              "checkedCommit": os.environ["PROOF_MERGE"], "tree": os.environ["PROOF_TREE"],
              "selection": selection, "emptyReason": reason, "passed": passed,
          }
          serialized = json.dumps(report, indent=2) + "\n"
          pathlib.Path(os.environ["RUNNER_TEMP"], "qualification-receipt.json").write_text(serialized)
          print(serialized)
          PY
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg head "$PROOF_HEAD" --arg base "$PROOF_BASE" --arg merge "$PROOF_MERGE" \
            '.state == "open" and .head.sha == $head and .base.sha == $base
            and .merge_commit_sha == $merge' <<< "$pr"
          state="$(jq -r 'if .passed then "success" else "failure" end' \
              "$RUNNER_TEMP/qualification-receipt.json")"
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$PROOF_HEAD" \
            -f state="$state" -f context="Qualification aggregate" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Verified combined tree ${PROOF_TREE:0:12}" \
            --jq '{state, context, creator: .creator.login}'
          [[ "$state" == success ]]
      - name: Retain checked tree
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-receipt
          path: ${{ runner.temp }}/qualification-receipt.json
          if-no-files-found: error
          retention-days: 14
