name: Qualification

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - qualification-input.json
      - .github/workflows/qualification.yml

permissions:
  contents: read

jobs:
  evidence:
    name: Qualification aggregate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify selection and combined tree
        env:
          PROOF_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          PROOF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PROOF_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess

          def revision(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          source = json.loads(pathlib.Path("qualification-input.json").read_text())
          base, head = os.environ["PROOF_BASE"], os.environ["PROOF_HEAD"]
          selection = source.get("selection")
          reason = source.get("emptyReason")
          tree = revision("HEAD^{tree}")
          exact = (revision("HEAD^1") == base and revision("HEAD^2") == head
                   if os.environ["PROOF_EVENT"] == "pull_request" else revision("HEAD") == head)
          passed = exact and (
              selection == ["value-control"] and source.get("observed") == "healthy"
              or selection == [] and isinstance(reason, str) and bool(reason.strip())
          )
          report = {"base": base, "head": head, "tree": tree,
                    "checkedCommit": revision("HEAD"), "selection": selection,
                    "emptyReason": reason, "passed": passed}
          serialized = json.dumps(report, indent=2) + "\n"
          pathlib.Path(os.environ["RUNNER_TEMP"], "qualification-receipt.json").write_text(serialized)
          print(serialized)
          if not passed:
              raise SystemExit("Qualification aggregate rejected the observed input")
          PY
      - name: Retain checked tree
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-receipt
          path: ${{ runner.temp }}/qualification-receipt.json
          if-no-files-found: error
          retention-days: 14
